backend:
  name: github
  repo: victoriamiccoli/studio-on-site
  branch: main

media_folder: "src/assets/img"
public_folder: "/assets/img"

locale: "fr"

collections:
  # ---------------- RÉGLAGES DU SITE ----------------
  - name: "reglages"
    label: "Réglages du site"
    files:
      - name: "site"
        label: "Général (menu, banderole, contact, pied de page)"
        file: "src/_data/site.json"
        fields:
          - { label: "Nom du site", name: "name", widget: "string" }
          - { label: "Slogan", name: "tagline", widget: "string" }
          - { label: "Logo", name: "logoImage", widget: "image", required: false }
          - { label: "Email de contact", name: "contactEmail", widget: "string" }
          - { label: "Téléphone", name: "contactPhone", widget: "string" }
          - { label: "Email des candidatures franchise", name: "franchiseEmail", widget: "string" }
          - label: "Menu de navigation"
            name: "nav"
            widget: "list"
            fields:
              - { label: "Libellé", name: "label", widget: "string" }
              - { label: "Lien", name: "url", widget: "string" }
          - label: "Banderole défilante"
            name: "marquee"
            widget: "list"
            summary: "{{fields.text}}"
            field: { label: "Texte", name: "text", widget: "string" }
          - label: "Pied de page"
            name: "footer"
            widget: "object"
            fields:
              - label: "Colonnes"
                name: "columns"
                widget: "list"
                fields:
                  - { label: "Titre", name: "title", widget: "string" }
                  - label: "Liens"
                    name: "links"
                    widget: "list"
                    fields:
                      - { label: "Libellé", name: "label", widget: "string" }
                      - { label: "Lien", name: "url", widget: "string" }
              - label: "Liens légaux"
                name: "legalLinks"
                widget: "list"
                fields:
                  - { label: "Libellé", name: "label", widget: "string" }
                  - { label: "Lien", name: "url", widget: "string" }
              - { label: "Mention copyright", name: "legal", widget: "string" }
              - { label: "Ville", name: "city", widget: "string" }
          # Connexion des formulaires (Make) - coller la meme URL dans les 3 champs
          - { label: "Lien formulaire Franchise (webhook Make)", name: "franchiseWebhook", widget: "string", required: false, hint: "URL du webhook Make. Reçoit les candidatures franchise." }
          - { label: "Lien formulaire Liste d'attente (webhook Make)", name: "waitlistWebhook", widget: "string", required: false, hint: "Meme URL que ci-dessus." }
          - { label: "Lien formulaire Contact (webhook Make)", name: "contactWebhook", widget: "string", required: false, hint: "Meme URL que ci-dessus." }
          # Champs techniques préservés (ne pas afficher)
          - { label: "Domaine", name: "domain", widget: "hidden" }
          - { label: "Lien Réserver", name: "reserverUrl", widget: "hidden" }
          - { label: "Compte Sportigo", name: "sportigoAccount", widget: "hidden" }

  # ---------------- TEXTES DE L'ACCUEIL ----------------
  - name: "accueil"
    label: "Textes de l'accueil"
    files:
      - name: "home"
        label: "Page d'accueil"
        file: "src/_data/home.json"
        fields:
          - { label: "Titre principal — ligne 1", name: "heroLine1", widget: "string" }
          - { label: "Titre principal — ligne 2 (en jaune)", name: "heroLine2", widget: "string" }
          - { label: "Titre principal — ligne 3", name: "heroLine3", widget: "string" }
          - { label: "Accroche (blanc)", name: "heroKickerWhite", widget: "string" }
          - { label: "Accroche (jaune)", name: "heroKickerYellow", widget: "string" }
          - label: "Points clés (sous l'accroche)"
            name: "heroBullets"
            widget: "list"
            summary: "{{fields.text}}"
            field: { label: "Texte", name: "text", widget: "string" }
          - { label: "Tarifs — titre", name: "tarifsTitle", widget: "string" }
          - { label: "Tarifs — sous-titre (blanc)", name: "tarifsSubtitleWhite", widget: "string" }
          - { label: "Tarifs — sous-titre (jaune)", name: "tarifsSubtitleYellow", widget: "string" }
          - { label: "Concept — sous-titre", name: "conceptSubtitle", widget: "string" }
          - { label: "Séances — titre", name: "seancesTitle", widget: "string" }
          - { label: "Séances — sous-titre", name: "seancesSubtitle", widget: "string" }
          - { label: "Coachs — titre", name: "coachsTitle", widget: "string" }
          - { label: "Coachs — sous-titre", name: "coachsSubtitle", widget: "string" }
          - { label: "Studios — titre", name: "studiosTitle", widget: "string" }
          - { label: "Studios — sous-titre", name: "studiosSubtitle", widget: "string" }
          - { label: "FAQ — titre", name: "faqTitle", widget: "string" }
          - { label: "FAQ — sous-titre", name: "faqSubtitle", widget: "string" }
          - { label: "Bloc final — texte", name: "ctaText", widget: "string", required: false }
          - { label: "App - logo/icône (image carrée, idéal 512x512)", name: "appIcon", widget: "image", required: false }
          - { label: "App - accroche (kicker)", name: "appKicker", widget: "string", required: false }
          - { label: "App - titre", name: "appTitle", widget: "string", required: false }
          - { label: "App - texte", name: "appText", widget: "text", required: false }
          - label: "App - points clés"
            name: "appBullets"
            widget: "list"
            required: false
            summary: "{{fields.text}}"
            field: { label: "Texte", name: "text", widget: "string" }
          - { label: "App - lien App Store", name: "appStoreUrl", widget: "string", required: false }
          - { label: "App - lien Google Play", name: "googlePlayUrl", widget: "string", required: false }
          - label: "Concept — 3 étapes"
            name: "steps"
            widget: "list"
            fields:
              - { label: "Numéro", name: "num", widget: "string" }
              - { label: "Étiquette", name: "label", widget: "string" }
              - { label: "Titre", name: "title", widget: "string" }
              - { label: "Texte", name: "text", widget: "text" }

  # ---------------- TARIFS ----------------
  - name: "tarifs"
    label: "Tarifs"
    files:
      - name: "tarifs"
        label: "Offres & paiements"
        file: "src/_data/tarifs.json"
        fields:
          - label: "Abonnements"
            name: "abonnements"
            widget: "list"
            fields:
              - { label: "Nom", name: "name", widget: "string" }
              - { label: "Badge", name: "badge", widget: "string", required: false }
              - { label: "Prix", name: "price", widget: "string" }
              - { label: "Unité (ex. / mois)", name: "per", widget: "string" }
              - { label: "Sous-titre", name: "sub", widget: "string", required: false }
              - { label: "Caractéristiques", name: "features", widget: "list", field: { label: "Ligne", name: "text", widget: "string" } }
              - { label: "Texte du bouton", name: "ctaLabel", widget: "string" }
              - { label: "ID Sportigo par défaut (utilisé si aucun paiement par studio n'est renseigné ci-dessous)", name: "offerId", widget: "string", required: false }
              - { label: "Titre sur la fenêtre de paiement (si vide, reprend le nom)", name: "payTitle", widget: "string", required: false }
              - label: "Paiement par studio"
                name: "payments"
                widget: "list"
                required: false
                summary: "{{fields.studio}} — {{fields.id}}"
                hint: "Pour chaque studio qui vend cette offre : choisis le studio et mets son ID Sportigo. La liste des studios se met à jour automatiquement quand tu en ajoutes un. Au clic sur Acheter/S'abonner, le client choisit son studio et le bon paiement se charge."
                fields:
                  - label: "Studio"
                    name: "studio"
                    widget: "relation"
                    collection: "studios"
                    file: "studios"
                    search_fields: ["list.*.name"]
                    value_field: "list.*.key"
                    display_fields: ["list.*.name"]
                  - { label: "ID Sportigo pour ce studio", name: "id", widget: "string" }
              - { label: "Mettre en avant (encadré)", name: "feature", widget: "boolean", default: false }
              - { label: "Le plus populaire (étiquette)", name: "popular", widget: "boolean", default: false, required: false }
          - label: "Séances & packs"
            name: "seances"
            widget: "list"
            fields:
              - { label: "Nom", name: "name", widget: "string" }
              - { label: "Badge", name: "badge", widget: "string", required: false }
              - { label: "Prix", name: "price", widget: "string" }
              - { label: "Unité", name: "per", widget: "string" }
              - { label: "Sous-titre", name: "sub", widget: "string", required: false }
              - { label: "Caractéristiques", name: "features", widget: "list", field: { label: "Ligne", name: "text", widget: "string" } }
              - { label: "Texte du bouton", name: "ctaLabel", widget: "string" }
              - { label: "ID Sportigo par défaut (utilisé si aucun paiement par studio n'est renseigné ci-dessous)", name: "offerId", widget: "string", required: false }
              - { label: "Titre sur la fenêtre de paiement (si vide, reprend le nom)", name: "payTitle", widget: "string", required: false }
              - label: "Paiement par studio"
                name: "payments"
                widget: "list"
                required: false
                summary: "{{fields.studio}} — {{fields.id}}"
                hint: "Pour chaque studio qui vend cette offre : choisis le studio et mets son ID Sportigo. La liste des studios se met à jour automatiquement quand tu en ajoutes un. Au clic sur Acheter/S'abonner, le client choisit son studio et le bon paiement se charge."
                fields:
                  - label: "Studio"
                    name: "studio"
                    widget: "relation"
                    collection: "studios"
                    file: "studios"
                    search_fields: ["list.*.name"]
                    value_field: "list.*.key"
                    display_fields: ["list.*.name"]
                  - { label: "ID Sportigo pour ce studio", name: "id", widget: "string" }
              - { label: "Mettre en avant (encadré)", name: "feature", widget: "boolean", default: false }
              - { label: "Le plus populaire (étiquette)", name: "popular", widget: "boolean", default: false, required: false }

  # ---------------- COACHS ----------------
  - name: "coachs"
    label: "Coachs"
    files:
      - name: "coachs"
        label: "Liste des coachs"
        file: "src/_data/coachs.json"
        fields:
          - label: "Coachs"
            name: "list"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - { label: "Nom", name: "name", widget: "string" }
              - { label: "Spécialité", name: "tag", widget: "string" }
              - { label: "Photo", name: "image", widget: "image", required: false }
              - { label: "Fond sombre", name: "dark", widget: "boolean", default: false }

  # ---------------- SÉANCES ----------------
  - name: "seances"
    label: "Séances (galerie)"
    files:
      - name: "seances"
        label: "Galerie des séances"
        file: "src/_data/seances.json"
        fields:
          - { label: "Filtres", name: "filters", widget: "list", field: { label: "Filtre", name: "text", widget: "string" } }
          - label: "Séances"
            name: "list"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Titre", name: "title", widget: "string" }
              - { label: "Infos (durée · coach)", name: "meta", widget: "string" }
              - { label: "Badge", name: "badge", widget: "string", required: false }
              - { label: "Photo", name: "image", widget: "image", required: false }
              - { label: "Fond sombre", name: "dark", widget: "boolean", default: false }
              - { label: "Grande hauteur", name: "tall", widget: "boolean", default: false }
              - { label: "Grande largeur", name: "wide", widget: "boolean", default: false }
              - { label: "Bouton lecture", name: "play", widget: "boolean", default: false }
              - { label: "Masquer sur l'accueil", name: "hideOnHome", widget: "boolean", default: false, required: false }

  # ---------------- STUDIOS (page vitrine) ----------------
  - name: "studios"
    label: "Studios (page vitrine)"
    files:
      - name: "studios"
        label: "Villes affichées"
        file: "src/_data/studios.json"
        fields:
          - label: "Studios"
            name: "list"
            widget: "list"
            summary: "{{fields.chip}}"
            fields:
              - { label: "Afficher sur le site", name: "visible", widget: "boolean", default: true }
              - label: "État"
                name: "etat"
                widget: "select"
                default: "soon"
                options:
                  - { label: "Ouvert (bouton Réserver)", value: "open" }
                  - { label: "Coming soon — Early birds (prévente avant ouverture)", value: "earlybird" }
                  - { label: "Liste d'attente (bouton Rejoindre la liste)", value: "waitlist" }
                  - { label: "Coming soon (aucun bouton)", value: "soon" }
              - { label: "Onglet (nom court affiché)", name: "chip", widget: "string" }
              - { label: "Clé (identifiant technique, sans espace)", name: "key", widget: "string" }
              - { label: "Nom", name: "name", widget: "string" }
              - { label: "Adresse", name: "adr", widget: "string" }
              - { label: "Photo", name: "image", widget: "image", required: false }
              - { label: "Ligne de statut (texte libre, optionnel)", name: "status", widget: "string", required: false }
              - { label: "Infos", name: "meta", widget: "list", required: false, field: { label: "Info", name: "text", widget: "string" } }
              - { label: "Lien du bouton (si Ouvert)", name: "ctaHref", widget: "string", required: false }
              - { label: "ID planning Sportigo (pour la page Réserver — vide si pas encore ouvert)", name: "planning", widget: "number", required: false, value_type: "int" }

  # ---------------- FAQ ----------------
  - name: "faq"
    label: "FAQ"
    files:
      - name: "faq"
        label: "Questions / réponses"
        file: "src/_data/faq.json"
        fields:
          - label: "Questions"
            name: "list"
            widget: "list"
            summary: "{{fields.q}}"
            fields:
              - { label: "Question", name: "q", widget: "string" }
              - { label: "Réponse", name: "a", widget: "text" }
