          - label: "Page Séances"
            name: "seances"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Masquer l'en-tête complet", name: "hideHero", widget: "boolean", default: false, required: false }
              - { label: "Masquer le label", name: "hideKicker", widget: "boolean", default: false, required: false }
