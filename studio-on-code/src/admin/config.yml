        fields:
          - label: "Page Tarifs"
            name: "tarifs"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Masquer l'en-tête complet", name: "hideHero", widget: "boolean", default: false, required: false }
              - { label: "Masquer le label", name: "hideKicker", widget: "boolean", default: false, required: false }
              - { label: "Masquer le titre", name: "hideTitle", widget: "boolean", default: false, required: false }
              - { label: "Masquer le sous-titre", name: "hideSubtitle", widget: "boolean", default: false, required: false }
              - { label: "Label (petit texte au-dessus)", name: "kicker", widget: "string", required: false, hint: "Laisse vide pour garder le texte par défaut" }
              - { label: "Titre", name: "title", widget: "string", required: false, hint: "Laisse vide pour garder le titre par défaut. Tu peux utiliser <br> et <em>…</em>" }
              - { label: "Sous-titre", name: "subtitle", widget: "string", required: false, hint: "Laisse vide pour garder le texte par défaut" }
              - { label: "Titre — partie jaune", name: "titleYellow", widget: "string", required: false }
