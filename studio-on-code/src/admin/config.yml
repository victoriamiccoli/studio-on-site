backend:
  name: github
  repo: victoriamiccoli/studio-on-site
  branch: main

media_folder: "src/assets/img"
public_folder: "/assets/img"

locale: "fr"

collections:
  # ---------------- RÉGLAGES DU SITE ----------------
  - name: "reglages"
    label: "Réglages du site"
    files:
      - name: "site"
        label: "Général (menu, banderole, contact, pied de page)"
        file: "src/_data/site.json"
        fields:
          - { label: "Nom du site", name: "name", widget: "string" }
          - { label: "Slogan", name: "tagline", widget: "string" }
          - { label: "Logo", name: "logoImage", widget: "image", required: false }
          - { label: "Email de contact", name: "contactEmail", widget: "string" }
          - { label: "Téléphone", name: "contactPhone", widget: "string" }
          - { label: "Email des candidatures franchise", name: "franchiseEmail", widget: "string" }
          - { label: "Texte du bouton « liste d'attente »", name: "waitlistCta", widget: "string", required: false, hint: "Défaut : Rejoins la liste d'attente" }
          - { label: "Liste d'attente — texte d'intro (vide = aucun)", name: "waitlistIntro", widget: "string", required: false, hint: "Laisse vide pour ne rien afficher au-dessus du formulaire" }
          - { label: "Liste d'attente — titre de confirmation", name: "waitlistSuccessTitle", widget: "string", required: false, hint: "Défaut : Merci !" }
          - { label: "Liste d'attente — message de confirmation", name: "waitlistSuccessText", widget: "string", required: false, hint: "Défaut : Tu es sur la liste d'attente 🖤" }
          - { label: "Banderole avant le pied de page — texte", name: "preFooterText", widget: "string", required: false, hint: "Défaut : Switch your body ON" }
          - { label: "Banderole avant le pied de page — pages où l'afficher", name: "preFooterPages", widget: "select", multiple: true, required: false, hint: "Coche les pages où la banderole doit apparaître, juste avant le pied de page", options: [{ label: "Accueil", value: "/" }, { label: "Concept", value: "/concept/" }, { label: "Séances", value: "/seances/" }, { label: "Coachs", value: "/coachs/" }, { label: "Tarifs", value: "/tarifs/" }, { label: "Studios", value: "/studios/" }, { label: "Franchises", value: "/franchises/" }, { label: "FAQ", value: "/faq/" }, { label: "Contact", value: "/contact/" }] }
          - label: "Menu de navigation"
            name: "nav"
            widget: "list"
            fields:
              - { label: "Libellé", name: "label", widget: "string" }
              - { label: "Lien", name: "url", widget: "string" }
          - label: "Banderole défilante"
            name: "marquee"
            widget: "list"
            summary: "{{fields.text}}"
            field: { label: "Texte", name: "text", widget: "string" }
          - label: "Pied de page"
            name: "footer"
            widget: "object"
            fields:
              - label: "Colonnes"
                name: "columns"
                widget: "list"
                fields:
                  - { label: "Titre", name: "title", widget: "string" }
                  - label: "Liens"
                    name: "links"
                    widget: "list"
                    fields:
                      - { label: "Libellé", name: "label", widget: "string" }
                      - { label: "Lien", name: "url", widget: "string" }
              - label: "Liens légaux"
                name: "legalLinks"
                widget: "list"
                fields:
                  - { label: "Libellé", name: "label", widget: "string" }
                  - { label: "Lien", name: "url", widget: "string" }
              - { label: "Mention copyright", name: "legal", widget: "string" }
              - { label: "Ville", name: "city", widget: "string" }
          # Connexion des formulaires (Make) - coller la meme URL dans les 3 champs
          - { label: "Lien formulaire Franchise (webhook Make)", name: "franchiseWebhook", widget: "string", required: false, hint: "URL du webhook Make. Reçoit les candidatures franchise." }
          - { label: "Lien formulaire Liste d'attente (webhook Make)", name: "waitlistWebhook", widget: "string", required: false, hint: "Meme URL que ci-dessus." }
          - { label: "Lien formulaire Contact (webhook Make)", name: "contactWebhook", widget: "string", required: false, hint: "Meme URL que ci-dessus." }
          # Champs techniques préservés (ne pas afficher)
          - { label: "Domaine", name: "domain", widget: "hidden" }
          - { label: "Lien Réserver", name: "reserverUrl", widget: "hidden" }
          - { label: "Compte Sportigo", name: "sportigoAccount", widget: "hidden" }

  # ---------------- TEXTES DE L'ACCUEIL ----------------
  - name: "accueil"
    label: "Textes de l'accueil"
    files:
      - name: "home"
        label: "Page d'accueil"
        file: "src/_data/home.json"
        fields:
          - { label: "Titre principal — ligne 1", name: "heroLine1", widget: "string", required: false }
          - { label: "Titre principal — ligne 2 (en jaune)", name: "heroLine2", widget: "string", required: false }
          - { label: "Titre principal — ligne 3", name: "heroLine3", widget: "string", required: false }
          - { label: "Accroche (blanc)", name: "heroKickerWhite", widget: "string", required: false }
          - { label: "Accroche (jaune)", name: "heroKickerYellow", widget: "string", required: false }
          - { label: "↳ Partie jaune en encadré (fond jaune)", name: "heroKickerBox", widget: "boolean", default: false, required: false }
          - { label: "↳ Mettre la partie jaune à la ligne", name: "heroKickerBreak", widget: "boolean", default: false, required: false }
          - label: "Points clés (sous l'accroche)"
            name: "heroBullets"
            widget: "list"
            summary: "{{fields.text}}"
            field: { label: "Texte", name: "text", widget: "string" }
          # L'ordre de l'accueil se gère désormais dans « Blocs (briques par page) → Blocs — Accueil »
          - { label: "Masquer la banderole défilante", name: "hideMarquee", widget: "boolean", default: false, required: false }
          - { label: "Masquer la partie Tarifs", name: "hideTarifs", widget: "boolean", default: false, required: false }
          - { label: "Masquer le titre de la partie Tarifs", name: "hideTarifsTitle", widget: "boolean", default: false, required: false }
          - { label: "Tarifs — titre", name: "tarifsTitle", widget: "string", required: false }
          - { label: "Titre sur une seule ligne (ne pas revenir à la ligne)", name: "tarifsTitleOneLine", widget: "boolean", default: false, required: false }
          - { label: "Tarifs — titre (partie jaune)", name: "tarifsTitleYellow", widget: "string", required: false }
          - { label: "↳ Partie jaune en encadré (fond jaune)", name: "tarifsTitleBox", widget: "boolean", default: false, required: false }
          - { label: "↳ Mettre la partie jaune à la ligne", name: "tarifsTitleBreak", widget: "boolean", default: false, required: false }
          - { label: "Tarifs — sous-titre (blanc)", name: "tarifsSubtitleWhite", widget: "string", required: false }
          - { label: "Tarifs — sous-titre (jaune)", name: "tarifsSubtitleYellow", widget: "string", required: false }
          - { label: "↳ Partie jaune en encadré (fond jaune)", name: "tarifsSubtitleBox", widget: "boolean", default: false, required: false }
          - { label: "↳ Mettre la partie jaune à la ligne", name: "tarifsSubtitleBreak", widget: "boolean", default: false, required: false }
          - { label: "Masquer la partie Séances", name: "hideSeances", widget: "boolean", default: false, required: false }
          - { label: "Masquer le titre de la partie Séances", name: "hideSeancesTitle", widget: "boolean", default: false, required: false }
          - { label: "Séances — titre", name: "seancesTitle", widget: "string", required: false }
          - { label: "Titre sur une seule ligne (ne pas revenir à la ligne)", name: "seancesTitleOneLine", widget: "boolean", default: false, required: false }
          - { label: "Séances — titre (partie jaune)", name: "seancesTitleYellow", widget: "string", required: false }
          - { label: "↳ Partie jaune en encadré (fond jaune)", name: "seancesTitleBox", widget: "boolean", default: false, required: false }
          - { label: "↳ Mettre la partie jaune à la ligne", name: "seancesTitleBreak", widget: "boolean", default: false, required: false }
          - { label: "Séances — sous-titre", name: "seancesSubtitle", widget: "string", required: false }
          - { label: "Séances — sous-titre (partie jaune)", name: "seancesSubtitleYellow", widget: "string", required: false }
          - { label: "↳ Partie jaune en encadré (fond jaune)", name: "seancesSubtitleBox", widget: "boolean", default: false, required: false }
          - { label: "↳ Mettre la partie jaune à la ligne", name: "seancesSubtitleBreak", widget: "boolean", default: false, required: false }
          - { label: "Masquer la partie Coachs", name: "hideCoachs", widget: "boolean", default: false, required: false }
          - { label: "Masquer le titre de la partie Coachs", name: "hideCoachsTitle", widget: "boolean", default: false, required: false }
          - { label: "Coachs — titre", name: "coachsTitle", widget: "string", required: false }
          - { label: "Titre sur une seule ligne (ne pas revenir à la ligne)", name: "coachsTitleOneLine", widget: "boolean", default: false, required: false }
          - { label: "Coachs — titre (partie jaune)", name: "coachsTitleYellow", widget: "string", required: false }
          - { label: "↳ Partie jaune en encadré (fond jaune)", name: "coachsTitleBox", widget: "boolean", default: false, required: false }
          - { label: "↳ Mettre la partie jaune à la ligne", name: "coachsTitleBreak", widget: "boolean", default: false, required: false }
          - { label: "Coachs — sous-titre", name: "coachsSubtitle", widget: "string", required: false }
          - { label: "Coachs — sous-titre (partie jaune)", name: "coachsSubtitleYellow", widget: "string", required: false }
          - { label: "↳ Partie jaune en encadré (fond jaune)", name: "coachsSubtitleBox", widget: "boolean", default: false, required: false }
          - { label: "↳ Mettre la partie jaune à la ligne", name: "coachsSubtitleBreak", widget: "boolean", default: false, required: false }
          - { label: "Masquer la partie Studios", name: "hideStudios", widget: "boolean", default: false, required: false }
          - { label: "Masquer le titre de la partie Studios", name: "hideStudiosTitle", widget: "boolean", default: false, required: false }
          - { label: "Studios — titre", name: "studiosTitle", widget: "string", required: false }
          - { label: "Titre sur une seule ligne (ne pas revenir à la ligne)", name: "studiosTitleOneLine", widget: "boolean", default: false, required: false }
          - { label: "Studios — titre (partie jaune)", name: "studiosTitleYellow", widget: "string", required: false }
          - { label: "↳ Partie jaune en encadré (fond jaune)", name: "studiosTitleBox", widget: "boolean", default: false, required: false }
          - { label: "↳ Mettre la partie jaune à la ligne", name: "studiosTitleBreak", widget: "boolean", default: false, required: false }
          - { label: "Studios — sous-titre", name: "studiosSubtitle", widget: "string", required: false }
          - { label: "Studios — sous-titre (partie jaune)", name: "studiosSubtitleYellow", widget: "string", required: false }
          - { label: "↳ Partie jaune en encadré (fond jaune)", name: "studiosSubtitleBox", widget: "boolean", default: false, required: false }
          - { label: "↳ Mettre la partie jaune à la ligne", name: "studiosSubtitleBreak", widget: "boolean", default: false, required: false }
          - { label: "Masquer la partie FAQ", name: "hideFaq", widget: "boolean", default: false, required: false }
          - { label: "Masquer le titre de la partie FAQ", name: "hideFaqTitle", widget: "boolean", default: false, required: false }
          - { label: "FAQ — titre", name: "faqTitle", widget: "string", required: false }
          - { label: "Titre sur une seule ligne (ne pas revenir à la ligne)", name: "faqTitleOneLine", widget: "boolean", default: false, required: false }
          - { label: "FAQ — titre (partie jaune)", name: "faqTitleYellow", widget: "string", required: false }
          - { label: "↳ Partie jaune en encadré (fond jaune)", name: "faqTitleBox", widget: "boolean", default: false, required: false }
          - { label: "↳ Mettre la partie jaune à la ligne", name: "faqTitleBreak", widget: "boolean", default: false, required: false }
          - { label: "FAQ — sous-titre", name: "faqSubtitle", widget: "string", required: false }
          - { label: "FAQ — sous-titre (partie jaune)", name: "faqSubtitleYellow", widget: "string", required: false }
          - { label: "↳ Partie jaune en encadré (fond jaune)", name: "faqSubtitleBox", widget: "boolean", default: false, required: false }
          - { label: "↳ Mettre la partie jaune à la ligne", name: "faqSubtitleBreak", widget: "boolean", default: false, required: false }
