              - { label: "Masquer le sous-titre", name: "hideSubtitle", widget: "boolean", default: false, required: false }
              - { label: "Label", name: "kicker", widget: "string", required: false }
              - { label: "Titre", name: "title", widget: "string", required: false }
              - { label: "Sous-titre", name: "subtitle", widget: "string", required: false }
              - { label: "Titre — partie jaune", name: "titleYellow", widget: "string", required: false }
              - { label: "↳ Encadré jaune (titre)", name: "titleBox", widget: "boolean", default: false, required: false }
              - { label: "↳ Partie jaune à la ligne (titre)", name: "titleBreak", widget: "boolean", default: false, required: false }
              - { label: "Titre sur une seule ligne", name: "titleOneLine", widget: "boolean", default: false, required: false }
              - { label: "Sous-titre — partie jaune", name: "subtitleYellow", widget: "string", required: false }
              - { label: "↳ Encadré jaune (sous-titre)", name: "subtitleBox", widget: "boolean", default: false, required: false }
              - { label: "↳ Partie jaune à la ligne (sous-titre)", name: "subtitleBreak", widget: "boolean", default: false, required: false }
          - label: "Page Franchises"
            name: "franchises"
